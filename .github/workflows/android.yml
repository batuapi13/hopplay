name: Android debug build

on:
  push:
    branches: [main, 'feature/android-tv-remote']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # TV preview prerelease publishing on trusted branch only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Run JVM unit tests
        run: gradle --no-daemon testMobileDebugUnitTest testTvDebugUnitTest
      # PRs compile with ephemeral debug keys for validation only. They never
      # publish installable update artifacts. Main uses one persisted keystore.
      - name: Restore persistent app signing identity
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/android-tv-remote') && github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.HOPPLAY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HOPPLAY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HOPPLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HOPPLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Persistent signing secrets are missing. Refusing to distribute an update-incompatible APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hopplay-signing.jks"
          chmod 600 "$RUNNER_TEMP/hopplay-signing.jks"
          echo "HOPPLAY_SIGNING_STORE=$RUNNER_TEMP/hopplay-signing.jks" >> "$GITHUB_ENV"
          echo "HOPPLAY_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "HOPPLAY_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "HOPPLAY_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "HOPPLAY_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Assemble FFmpeg-enabled debug APK
        run: gradle --no-daemon assembleMobileDebug assembleTvDebug -Pffmpeg=true
      - name: Verify both architecture APKs exist
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/android-tv-remote') && github.event_name == 'push'
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/mobile/debug/
          test -s app/build/outputs/apk/mobile/debug/app-mobile-armeabi-v7a-debug.apk
          test -s app/build/outputs/apk/mobile/debug/app-mobile-arm64-v8a-debug.apk
      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: hopplay-armeabi-v7a-apk-tv-preview
          path: app/build/outputs/apk/mobile/debug/app-mobile-armeabi-v7a-debug.apk
          if-no-files-found: error
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: hopplay-arm64-v8a-apk-tv-preview
          path: app/build/outputs/apk/mobile/debug/app-mobile-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Publish signed TV test APKs as a GitHub prerelease
        if: github.ref == 'refs/heads/feature/android-tv-remote' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARM32=app/build/outputs/apk/tv/debug/app-tv-armeabi-v7a-debug.apk
          ARM64=app/build/outputs/apk/tv/debug/app-tv-arm64-v8a-debug.apk
          test -s "$ARM32"
          test -s "$ARM64"
          TAG="tv-preview-build.${GITHUB_RUN_NUMBER}"
          cp "$ARM32" "HopPlay-TV-${TAG}-armeabi-v7a.apk"
          cp "$ARM64" "HopPlay-TV-${TAG}-arm64-v8a.apk"
          sha256sum HopPlay-TV-*.apk > SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" HopPlay-TV-*.apk SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" HopPlay-TV-*.apk SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "HopPlay TV preview (build ${GITHUB_RUN_NUMBER})" \
              --notes "TEST ONLY: remote-control prototype. Separate com.hopplay.tv package; phone/tablet v0.3.1 is unchanged." \
              --prerelease
          fi

  release:
    # Only publish after the signed ARM32 and ARM64 builds and tests pass on main.
    needs: build
    if: false # TV candidate is test-only; do not publish or alter existing GitHub Releases.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download ARM32 APK
        uses: actions/download-artifact@v4
        with:
          name: hopplay-armeabi-v7a-apk-tv-preview
          path: dist/arm32
      - name: Download ARM64 APK
        uses: actions/download-artifact@v4
        with:
          name: hopplay-arm64-v8a-apk-tv-preview
          path: dist/arm64
      - name: Publish updated GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          test -s dist/arm32/app-mobile-armeabi-v7a-debug.apk
          test -s dist/arm64/app-mobile-arm64-v8a-debug.apk
          cp dist/arm32/app-mobile-armeabi-v7a-debug.apk "HopPlay-${TAG}-armeabi-v7a.apk"
          cp dist/arm64/app-mobile-arm64-v8a-debug.apk "HopPlay-${TAG}-arm64-v8a.apk"
          sha256sum "HopPlay-${TAG}-armeabi-v7a.apk" "HopPlay-${TAG}-arm64-v8a.apk" > SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A workflow rerun must update the same tag, not create a second release.
            gh release upload "$TAG" "HopPlay-${TAG}-armeabi-v7a.apk" "HopPlay-${TAG}-arm64-v8a.apk" SHA256SUMS.txt --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" \
              "HopPlay-${TAG}-armeabi-v7a.apk" \
              "HopPlay-${TAG}-arm64-v8a.apk" \
              SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "HopPlay ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
              --generate-notes \
              --latest
          fi
