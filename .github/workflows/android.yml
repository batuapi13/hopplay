name: Android debug build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest
      # PRs compile with ephemeral debug keys for validation only. They never
      # publish installable update artifacts. Main uses one persisted keystore.
      - name: Restore persistent app signing identity
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.HOPPLAY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HOPPLAY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HOPPLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HOPPLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Persistent signing secrets are missing. Refusing to distribute an update-incompatible APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hopplay-signing.jks"
          chmod 600 "$RUNNER_TEMP/hopplay-signing.jks"
          echo "HOPPLAY_SIGNING_STORE=$RUNNER_TEMP/hopplay-signing.jks" >> "$GITHUB_ENV"
          echo "HOPPLAY_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "HOPPLAY_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "HOPPLAY_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "HOPPLAY_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Assemble FFmpeg-enabled debug APK
        run: gradle --no-daemon assembleDebug -Pffmpeg=true
      - name: Verify both architecture APKs exist
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          test -s app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: hopplay-armeabi-v7a-apk
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: hopplay-arm64-v8a-apk
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
